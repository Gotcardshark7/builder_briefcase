<div class="row g-3">
  <div class="col-12">
    <label class="form-label" for="entrance-animation">Animación de entrada</label>
    <select
      class="form-select"
      id="entrance-animation"
      [value]="config.entrance"
      (change)="updateEntrance($event)"
    >
      @for (option of animationOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label" for="animation-duration">Duración (segundos)</label>
    <input
      class="form-control"
      id="animation-duration"
      type="number"
      min="0"
      step="0.1"
      [value]="config.duration"
      (input)="updateDuration($event)"
    />
  </div>

  <div class="col-md-6">
    <label class="form-label" for="animation-delay">Retardo (segundos)</label>
    <input
      class="form-control"
      id="animation-delay"
      type="number"
      min="0"
      step="0.1"
      [value]="config.delay"
      (input)="updateDelay($event)"
    />
  </div>
</div>
